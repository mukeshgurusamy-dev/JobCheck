name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev --legacy-peer-deps
        timeout-minutes: 5

      - name: Build
        run: time npm run build
        timeout-minutes: 2

      - name: Run tests
        run: npm test
        timeout-minutes: 5

      - name: Upload benchmark failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-failures
          path: tests/failures.json
          if-no-files-found: ignore
