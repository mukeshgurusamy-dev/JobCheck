name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this covers
      # both type-checking and the production bundle.
      - name: Type-check and build
        run: npm run build

      # Full Vitest suite. This includes the two evaluation gates:
      #   tests/evaluate.test.ts     -> accuracy >= 90%, zero false negatives
      #   tests/benchmark100.test.ts -> accuracy >= 95%, zero false negatives
      # A scam posting rated "Low" fails the build by design.
      - name: Run tests
        run: npm test

      - name: Upload benchmark failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-failures
          path: tests/failures.json
          if-no-files-found: ignore
