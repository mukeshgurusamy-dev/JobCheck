            "@type": "Answer",
            "text": "JobCheck uses 100+ automated rules to analyze URLs for phishing patterns, checks domain age and registration history, detects suspicious TLDs and lookalike brands, and uses AI-powered web search to verify company information and employee reviews."

        {
          "@type": "Question",
          "name": "Is JobCheck really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, JobCheck is completely free. We do not charge for analysis, store your data server-side, or display ads. All scoring happens in your browser."
          }
        },
        {
          "@type": "Question",
          "name": "What does the risk score mean?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Scores range from 0–100: 0–24 is Low Risk (likely legitimate), 25–54 is Medium Risk (verify independently), and 55–100 is High Risk (likely a scam or heavily suspicious)."
          }
        },
        {
          "@type": "Question",
          "name": "Does JobCheck store my data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your job URLs and descriptions are analyzed entirely in your browser. We do not store, log, or track any user input server-side."
          }
        }
      ]
    }
