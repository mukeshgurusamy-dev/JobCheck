[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The AI investigation calls Gemini with Google Search grounding, which
# regularly takes longer than Netlify's 10s default. Without this the platform
# kills the function before the search returns and the scan silently degrades to
# rules-only. 26s is Netlify's ceiling.
[functions.inspect]
  timeout = 26

[dev]
  framework = "#static"
  publish = "dist"
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    # Enhanced Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; block-all-mixed-content"

    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"

    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Control referrer information
    Referrer-Policy = "no-referrer"

    # Restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()"

    # Enable HSTS (HTTP Strict Transport Security)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # XSS Protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Cross-Origin Policies (defense in depth)
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # Additional security headers
    X-Permitted-Cross-Domain-Policies = "none"
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large"
    Expect-CT = "max-age=86400, enforce"

# Service worker - no cache (always fetch fresh to check for updates)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets - long cache (1 year, Vite hashes filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images - long cache
[[headers]]
  for = "/logo.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML - revalidate frequently for updates
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"